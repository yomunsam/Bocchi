# Bocchi HomeServer 的 Docker Compose 示例。
# 用法见 Docs/Guide_Hans 下的部署指南；启动：docker compose -f Deploy/compose.yaml up -d
services:
  bocchi:
    # 镜像不提供 latest，启动前设置 BOCCHI_VERSION（如 0.1.0）。
    # 想从源码构建时注释掉 image，改用下面的 build
    image: ghcr.io/yomunsam/bocchi:${BOCCHI_VERSION:?请设置 BOCCHI_VERSION，例如 0.1.0}
    # build:
    #   context: ..
    restart: unless-stopped
    ports:
      # 只监听本机，由同机的反向代理（Caddy / Nginx）对外提供 HTTPS
      - "127.0.0.1:8080:8080"
    environment:
      # Bocchi 只信任这些来源的 X-Forwarded-* 头。
      # 宿主机上的代理经下面 bocchi 网络的网关连进容器，所以只信任这个网关。
      Bocchi__ReverseProxy__TrustedProxies: "172.31.250.1"
    networks:
      - bocchi
    volumes:
      - bocchi-data:/data

networks:
  # 固定网段，网关地址才稳定。和本机已有网段冲突时，两处一起改。
  bocchi:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1

volumes:
  bocchi-data:
